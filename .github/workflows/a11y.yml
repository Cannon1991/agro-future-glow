name: A11y Regression

on:
  pull_request:
  push:
    branches: [main]

jobs:
  a11y:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install JS dependencies
        run: bun install --frozen-lockfile

      - name: Install Playwright (Python) + Chromium
        run: |
          python -m pip install --upgrade pip
          python -m pip install playwright
          python -m playwright install --with-deps chromium

      - name: Start dev server
        env:
          LOVABLE_API_KEY: ${{ secrets.LOVABLE_API_KEY }}
        run: |
          bun run dev --port 8080 > dev-server.log 2>&1 &
          echo $! > dev-server.pid
          # Wait for server to be reachable
          for i in {1..60}; do
            if curl -sf http://localhost:8080 > /dev/null; then
              echo "Dev server is up"
              exit 0
            fi
            sleep 1
          done
          echo "Dev server failed to start" >&2
          cat dev-server.log >&2
          exit 1

      - name: Run a11y regression tests
        run: python3 tests/a11y/interactive_demo.spec.py

      - name: Run keyboard-only navigation tests
        run: python3 tests/a11y/keyboard_nav.spec.py

      - name: Run keyboard reachability / focus indicator tests at 320px
        run: python3 tests/a11y/keyboard_320.spec.py

      - name: Run contrast, landmark and heading tests
        run: python3 tests/a11y/contrast_landmarks.spec.py

      - name: Run narrow-width (320px / 375px) color contrast tests
        run: python3 tests/a11y/contrast_narrow.spec.py

      - name: Run reduced-motion tests
        run: python3 tests/a11y/reduced_motion.spec.py

      - name: Run ARIA live region tests
        run: python3 tests/a11y/live_regions.spec.py

      - name: Run reflow / 200% text zoom tests
        run: python3 tests/a11y/reflow_zoom.spec.py



      - name: Upload screenshots on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: a11y-screenshots
          path: tests/a11y/screenshots/
          if-no-files-found: ignore

      - name: Upload dev server log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: dev-server-log
          path: dev-server.log
          if-no-files-found: ignore

      - name: Stop dev server
        if: always()
        run: |
          if [ -f dev-server.pid ]; then
            kill "$(cat dev-server.pid)" 2>/dev/null || true
          fi
